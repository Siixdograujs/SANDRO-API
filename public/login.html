<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Login</h1>
      <form id="loginForm" class="centered">
        <input class="input" name="username" placeholder="Insira o nome de Usuário" required />
        <input class="input" name="password" type="password" placeholder="Insira Sua Senha" required />
        <button class="btn" type="submit">Entrar</button>
      </form>
      <p class="help">Ainda não tem uma conta? <a class="link" href="/register.html">Criar</a></p>
      <p id="msg" style="color:#ffb3b3;margin-top:8px"></p>
    </div>
  </div>

  <script>
    const msg = document.getElementById('msg');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const f = e.target;
      const body = { username: f.username.value.trim(), password: f.password.value };
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: {'content-type':'application/json'},
          body: JSON.stringify(body)
        });
        const data = await res.json();
        if (!res.ok) { msg.textContent = data.error || 'Erro'; return; }
        msg.style.color = '#bff0ff';
        msg.textContent = 'Login com sucesso! Redirecionando...';
        setTimeout(()=> location.href = '/dashboard', 700);
      } catch (err) {
        msg.textContent = 'Erro de conexão';
      }
    });
  </script>
</body>
</html>
